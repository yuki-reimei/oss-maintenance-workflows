name: Documentation improvement
description: Suggest a documentation fix or improvement
title: "Docs: "
labels: [documentation]
body:
  - type: textarea
    id: problem
    attributes:
      label: What should be improved?
      description: Describe the unclear, missing, or outdated documentation.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested change
      description: If you have a specific wording or structure in mind, include it here.
    validations:
      required: false
