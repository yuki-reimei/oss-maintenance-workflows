name: Bug report
description: Report a reproducible problem
title: "Bug: "
labels: [bug, needs-info]
body:
  - type: markdown
    attributes:
      value: Thank you for reporting a problem. Please include enough detail for maintainers to reproduce it.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the steps needed to reproduce the issue.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include version, OS, browser, device, or other relevant details.
    validations:
      required: false
